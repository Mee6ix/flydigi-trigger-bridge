name: Flydigi Trigger Bridge - Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run offline checks
        shell: powershell
        run: .\build.ps1
      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: FlydigiTriggerBridge-windows-x64
          path: dist/
